<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxe Collection | Etalase Eksklusif</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0c10; color: #e0e0e0; }
    .font-serif-custom { font-family: 'Cormorant Garamond', serif; }
    .gold-accent { color: #d4af37; }
    .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    
    /* Animasi Kelap-Kelip (Pulsing Dot) */
    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-green 2s infinite;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-card px-6 py-4 flex flex-col items-center justify-center border-b border-white/10">
    <h1 class="font-serif-custom text-2xl md:text-3xl font-bold tracking-widest gold-accent text-center">LUXE BOUTIQUE</h1>
    
    <!-- Developer Badge dengan Animasi Kelap Kelip -->
    <div class="flex items-center gap-2 mt-1">
      <span class="status-dot"></span>
      <span class="text-[11px] tracking-wider text-gray-400 font-mono">developer : fatur62</span>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="py-12 px-6 text-center max-w-3xl mx-auto">
    <span class="text-xs uppercase tracking-[0.3em] gold-accent mb-2 block">Koleksi Pilihan</span>
    <h2 class="font-serif-custom text-3xl md:text-5xl font-normal leading-tight mb-3">Pakaian & Perlengkapan Rumah</h2>
    <p class="text-gray-400 text-xs md:text-sm max-w-lg mx-auto font-light">Pilihan busana pria, wanita, anak-anak, selimut, bedcover, hingga kain jarik tradisional.</p>
  </section>

  <!-- Filter Kategori -->
  <section class="max-w-6xl mx-auto px-6 mb-8">
    <div class="flex gap-2.5 overflow-x-auto pb-3 text-xs tracking-wider uppercase no-scrollbar">
      <button onclick="filterKategori('Semua')" class="px-4 py-2 rounded-full glass-card border border-yellow-500/40 gold-accent whitespace-nowrap">Semua</button>
      <button onclick="filterKategori('Pria')" class="px-4 py-2 rounded-full glass-card text-gray-300 hover:gold-accent whitespace-nowrap">Pria</button>
      <button onclick="filterKategori('Wanita')" class="px-4 py-2 rounded-full glass-card text-gray-300 hover:gold-accent whitespace-nowrap">Wanita</button>
      <button onclick="filterKategori('Anak')" class="px-4 py-2 rounded-full glass-card text-gray-300 hover:gold-accent whitespace-nowrap">Anak-Anak</button>
      <button onclick="filterKategori('Bedcover')" class="px-4 py-2 rounded-full glass-card text-gray-300 hover:gold-accent whitespace-nowrap">Bedcover & Selimut</button>
      <button onclick="filterKategori('Jarik')" class="px-4 py-2 rounded-full glass-card text-gray-300 hover:gold-accent whitespace-nowrap">Jarik</button>
    </div>
  </section>

  <!-- Grid Produk -->
  <section class="max-w-6xl mx-auto px-6">
    <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      <div class="col-span-full text-center py-12 text-gray-500 text-sm">Memuat katalog barang...</div>
    </div>
  </section>

  <script>
    const SUPABASE_URL = 'https://PROJECT_ID_KAMU.supabase.co';
    const SUPABASE_KEY = 'ANON_KEY_SUPABASE_KAMU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    async function loadProducts() {
      const { data, error } = await _supabase.from('products').select('*').order('id', { ascending: false });
      if (error) { console.error(error); return; }
      allProducts = data;
      renderProducts(allProducts);
    }

    function renderProducts(items) {
      const grid = document.getElementById('product-grid');
      if (!items.length) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">Belum ada barang ditampilkan.</div>`;
        return;
      }
      grid.innerHTML = items.map(p => `
        <div class="glass-card rounded-xl overflow-hidden flex flex-col justify-between group">
          <div>
            <div class="aspect-[3/4] overflow-hidden bg-gray-900 relative">
              <img src="${p.image_url || 'https://via.placeholder.com/400x500?text=No+Image'}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <span class="absolute top-2 left-2 text-[10px] uppercase tracking-wider bg-black/70 backdrop-blur-md px-2 py-0.5 rounded text-gray-300">${p.category}</span>
            </div>
            <div class="p-3.5">
              <p class="text-[10px] font-mono text-gray-500 uppercase">${p.kode_barang}</p>
              <h3 class="font-serif-custom text-base md:text-lg font-semibold tracking-wide text-gray-100 mt-0.5">${p.title}</h3>
              <p class="text-xs text-gray-400 mt-1 line-clamp-2 font-light">${p.description || ''}</p>
              <p class="text-sm font-semibold gold-accent mt-2">Rp ${Number(p.harga_jual).toLocaleString('id-ID')}</p>
            </div>
          </div>
          <div class="p-3.5 pt-0">
            <a href="https://wa.me/6281234567890?text=Halo,%20saya%20tertarik%20dengan%20produk:%20${encodeURIComponent(p.title)}%20(Kode:%20${p.kode_barang})" 
               target="_blank" 
               class="block w-full text-center py-2 text-[11px] uppercase tracking-widest bg-white/5 hover:bg-yellow-600 hover:text-black border border-white/10 rounded-lg transition duration-300">
               Tanya via WA
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterKategori(kat) {
      if (kat === 'Semua') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category && p.category.toLowerCase().includes(kat.toLowerCase())));
    }

    loadProducts();
  </script>
</body>
</html>
